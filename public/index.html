<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeeFitness Payments Control</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0a0a0a;color:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#202020 0,#0a0a0a 48%,#050505 100%);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}.brand{font-size:28px;font-weight:800}.muted{color:#9d9d9d}.badge{padding:8px 12px;border:1px solid #333;border-radius:999px;background:#111}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(22,22,22,.9);border:1px solid #292929;border-radius:20px;padding:20px;box-shadow:0 12px 40px #0008}.num{font-size:32px;font-weight:800;margin-top:8px}.table{margin-top:18px;overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:14px;border-bottom:1px solid #242424;text-align:right;white-space:nowrap}th{color:#aaa;font-weight:600}.ok{color:#8cffc1}.warn{color:#ffd166}.foot{margin-top:26px;color:#777;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="brand">BeeFitness · Payments Control</div><div class="muted">Tabby + Tamara · Webhooks · State handling</div></div><div class="badge" id="mode">...</div></header><section class="grid"><div class="card"><div class="muted">إجمالي العمليات</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">المدفوعة</div><div class="num ok" id="paid">0</div></div><div class="card"><div class="muted">قيد الانتظار</div><div class="num warn" id="pending">0</div></div><div class="card"><div class="muted">الإيراد</div><div class="num" id="revenue">0 ر.س</div></div></section><section class="card table"><table><thead><tr><th>المرجع</th><th>المزود</th><th>المبلغ</th><th>الحالة</th><th>الوقت</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="muted">لا توجد عمليات بعد</td></tr></tbody></table></section><div class="foot">المالك: Ahmed jafari — تلفون: 0173266999</div></main><script>
async function load(){const [s,o]=await Promise.all([fetch("/api/stats"),fetch("/api/orders")]);const st=await s.json(),orders=await o.json();document.querySelector("#total").textContent=st.totalOrders;document.querySelector("#paid").textContent=st.paidOrders;document.querySelector("#pending").textContent=st.pending;document.querySelector("#revenue").textContent=new Intl.NumberFormat("ar-SA",{maximumFractionDigits:2}).format(st.revenue)+" ر.س";document.querySelector("#mode").textContent="MODE: "+location.hostname;document.querySelector("#rows").innerHTML=orders.length?orders.map(x=>`<tr><td>${esc(x.referenceId)}</td><td>${esc(x.provider)}</td><td>${x.amount.toLocaleString("ar-SA")} ${x.currency}</td><td>${esc(x.status)}</td><td>${new Date(x.createdAt).toLocaleString("ar-SA")}</td></tr>`).join(""):'<tr><td colspan="5" class="muted">لا توجد عمليات بعد</td></tr>'}function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}load();setInterval(load,10000);
</script></body></html>
