<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BeeFitness | إدارة المنتجات</title><style>
body{margin:0;background:#0a0d0a;color:#f4f5ef;font-family:system-ui;direction:rtl}.wrap{max-width:1050px;margin:auto;padding:24px}.panel{background:#151b16;border:1px solid #303b30;border-radius:18px;padding:20px;margin:16px 0}h1,h2{color:#c5e58a}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,textarea{width:100%;box-sizing:border-box;background:#0d120e;border:1px solid #39443a;border-radius:9px;color:white;padding:12px;margin:6px 0 12px}button,a{background:#c5e58a;color:#111a0d;border:0;border-radius:9px;padding:11px 15px;font-weight:700;text-decoration:none;cursor:pointer}.muted{color:#aab5a8}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:11px;border-bottom:1px solid #303b30}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><a href="/dashboard">العودة إلى لوحة الدفع</a><h1>إدارة كتالوج BeeFitness</h1><p class="muted">إضافة المنتجات والأسعار والمخزون المعتمدة. التخزين مؤقت في ذاكرة الخادم حتى تنفيذ PostgreSQL بموافقة منفصلة.</p>
<form id="form" class="panel"><h2>إضافة منتج</h2><div class="grid"><label>اسم المنتج<input name="name" required minlength="2" maxlength="140"></label><label>التصنيف<input name="category" required maxlength="80"></label><label>SKU<input name="sku" maxlength="80"></label><label>السعر بالريال<input name="price" type="number" min="0.01" step="0.01" required></label><label>المخزون<input name="stock" type="number" min="0" step="1" value="0" required></label><label>رابط الصورة<input name="imageUrl" type="url"></label></div><label>الوصف<textarea name="description" rows="3" maxlength="1200"></textarea></label><label><input name="active" type="checkbox" checked style="width:auto"> نشر المنتج عند توفر المخزون</label><button>حفظ المنتج</button><p id="message" class="muted"></p></form>
<section class="panel"><h2>المنتجات الحالية</h2><div style="overflow:auto"><table><thead><tr><th>المنتج</th><th>التصنيف</th><th>السعر</th><th>المخزون</th><th>الحالة</th></tr></thead><tbody id="rows"><tr><td colspan="5">تحميل...</td></tr></tbody></table></div></section></main>
<script>
const form=document.querySelector("#form"),msg=document.querySelector("#message"),rows=document.querySelector("#rows");
const esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
async function load(){const r=await fetch("/api/admin/products");if(r.status===401){location.href="/login";return;}const list=await r.json();rows.innerHTML=list.length?list.map(p=>"<tr><td>"+esc(p.name)+"<br><small>"+esc(p.sku)+"</small></td><td>"+esc(p.category)+"</td><td>"+(p.priceHalalas/100).toFixed(2)+" ر.س</td><td>"+p.stock+"</td><td>"+(p.active?"مفعل":"مخفي")+"</td></tr>").join(""):'<tr><td colspan="5">لا توجد منتجات بعد.</td></tr>';}
form.onsubmit=async e=>{e.preventDefault();const d=new FormData(form),body={name:d.get("name"),category:d.get("category"),sku:d.get("sku"),priceHalalas:Math.round(Number(d.get("price"))*100),stock:Number(d.get("stock")),description:d.get("description"),active:d.get("active")==="on"};if(d.get("imageUrl"))body.imageUrl=d.get("imageUrl");const r=await fetch("/api/admin/products",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const result=await r.json();if(!r.ok){msg.textContent="تعذر الحفظ: "+(result.error||"خطأ");return;}form.reset();msg.textContent="تمت إضافة المنتج في ذاكرة الخادم مؤقتاً.";await load();};load();
</script></body></html>
